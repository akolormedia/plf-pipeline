[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plf-pipeline"
version = "0.1.0"
description = "PLF pipeline — video to .raw.plf auto-generation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "ffmpeg-python>=0.2",
]

[project.optional-dependencies]
scene = [
    "scenedetect>=0.7",
    "opencv-python>=4.8",
]
audio = [
    "openai-whisper>=20231117",
]
vision = [
    "ollama>=0.3",
]
diarization = [
    "pyannote-audio>=3.1",
]
classify = [
    "panns-inference>=0.1.1",
]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
]
full = [
    "plf-pipeline[scene,audio,vision,diarization,classify,server]",
]

# NOTE (torch stack): `pyannote-audio` pulls a specific `torch` version and can
# DOWNGRADE an existing torch install, breaking `torchvision`/`torchaudio`
# (errors like "operator torchvision::nms does not exist"). The verified-good
# trio in this environment is torch==2.8.0 + torchaudio==2.8.0 +
# torchvision==0.23.0. Install the diarization extra with care, or reinstall
# that trio together afterwards.

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
